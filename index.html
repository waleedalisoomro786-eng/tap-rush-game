<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Rush</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: min(100%, 430px);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 38px;
    }

    .subtitle {
      color: #666;
      margin-top: 8px;
      margin-bottom: 22px;
    }

    .score-box {
      display: flex;
      justify-content: space-around;
      margin: 18px 0;
    }

    .score-label {
      color: #666;
      font-size: 16px;
    }

    .score {
      font-size: 34px;
      font-weight: bold;
      margin-top: 4px;
    }

    #timer {
      font-size: 21px;
      font-weight: bold;
      margin: 18px 0;
    }

    #tapButton {
      width: min(70vw, 240px);
      height: min(70vw, 240px);
      border-radius: 50%;
      border: 0;
      background: #111827;
      color: white;
      font-size: 34px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 9px 0 #4b5563;
      touch-action: manipulation;
      transition: transform 0.08s;
    }

    #tapButton:active:not(:disabled) {
      transform: translateY(7px);
      box-shadow: 0 2px 0 #4b5563;
    }

    #tapButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #startButton {
      margin-top: 28px;
      padding: 15px 32px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      min-height: 28px;
      margin-top: 18px;
      font-weight: bold;
      font-size: 17px;
    }

    .footer {
      margin-top: 20px;
      color: #888;
      font-size: 13px;
    }

    .pop {
      animation: pop 0.18s ease;
    }

    @keyframes pop {
      50% {
        transform: scale(1.06);
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>⚡ Tap Rush</h1>
    <div class="subtitle">Tap as fast as you can!</div>

    <div class="score-box">

      <div>
        <div class="score-label">Score</div>
        <div id="score" class="score">0</div>
      </div>

      <div>
        <div class="score-label">Best</div>
        <div id="best" class="score">0</div>
      </div>

    </div>

    <div id="timer">Time: 10s</div>

    <button id="tapButton" disabled>TAP!</button>

    <br>

    <button id="startButton">START GAME</button>

    <div id="message"></div>

    <div class="footer">
      Made with care · Tap Rush
    </div>

  </div>

  <script>
    let score = 0;
    let timeLeft = 10;
    let gameRunning = false;
    let timer;

    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const timerElement = document.getElementById("timer");
    const tapButton = document.getElementById("tapButton");
    const startButton = document.getElementById("startButton");
    const message = document.getElementById("message");

    let bestScore = Number(localStorage.getItem("tapRushBest")) || 0;
    bestElement.textContent = bestScore;

    startButton.addEventListener("click", startGame);

    tapButton.addEventListener("click", function () {
      if (!gameRunning) return;

      score++;
      scoreElement.textContent = score;

      scoreElement.classList.remove("pop");
      void scoreElement.offsetWidth;
      scoreElement.classList.add("pop");

      if (navigator.vibrate) {
        navigator.vibrate(12);
      }
    });

    function startGame() {
      clearInterval(timer);

      score = 0;
      timeLeft = 10;
      gameRunning = true;

      scoreElement.textContent = "0";
      timerElement.textContent = "Time: 10s";
      message.textContent = "";

      tapButton.disabled = false;
      startButton.disabled = true;

      timer = setInterval(function () {
        timeLeft--;

        timerElement.textContent = "Time: " + timeLeft + "s";

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      gameRunning = false;

      tapButton.disabled = true;
      startButton.disabled = false;

      if (score > bestScore) {
        bestScore = score;

        localStorage.setItem("tapRushBest", bestScore);
        bestElement.textContent = bestScore;

        message.textContent = "🎉 New Best Score: " + score + "!";
      } else {
        message.textContent = "⏱️ Time's up! Your score: " + score;
      }
    }
  </script>

</body>
    </html>
