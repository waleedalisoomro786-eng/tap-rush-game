<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Rush</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: min(92%, 420px);
      background: white;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 5px 0;
      font-size: 36px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .score-box {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      font-size: 20px;
    }

    .score {
      font-weight: bold;
      font-size: 30px;
    }

    #timer {
      font-size: 22px;
      margin: 15px 0;
    }

    #tapButton {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #111;
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #555;
      touch-action: manipulation;
    }

    #tapButton:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #555;
    }

    #startButton {
      margin-top: 25px;
      padding: 14px 30px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      font-weight: bold;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>⚡ Tap Rush</h1>
    <div class="subtitle">Tap as fast as you can!</div>

    <div class="score-box">
      <div>
        Score
        <div id="score" class="score">0</div>
      </div>

      <div>
        Best
        <div id="best" class="score">0</div>
      </div>
    </div>

    <div id="timer">Time: 10s</div>

    <button id="tapButton" disabled>TAP!</button>

    <br>

    <button id="startButton">START GAME</button>

    <div id="message"></div>

    <div class="footer">
      Made with care · Tap Rush
    </div>

  </div>

  <script>
    let score = 0;
    let timeLeft = 10;
    let gameRunning = false;
    let timer;

    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const timerElement = document.getElementById("timer");
    const tapButton = document.getElementById("tapButton");
    const startButton = document.getElementById("startButton");
    const message = document.getElementById("message");

    let bestScore = Number(localStorage.getItem("tapRushBest") || 0);
    bestElement.textContent = bestScore;

    startButton.addEventListener("click", startGame);

    tapButton.addEventListener("click", function () {
      if (!gameRunning) return;

      score++;
      scoreElement.textContent = score;
    });

    function startGame() {
      clearInterval(timer);

      score = 0;
      timeLeft = 10;
      gameRunning = true;

      scoreElement.textContent = "0";
      timerElement.textContent = "Time: 10s";
      message.textContent = "";

      tapButton.disabled = false;
      startButton.disabled = true;

      timer = setInterval(function () {
        timeLeft--;

        timerElement.textContent = "Time: " + timeLeft + "s";

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      gameRunning = false;

      tapButton.disabled = true;
      startButton.disabled = false;

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("tapRushBest", bestScore);
        bestElement.textContent = bestScore;

        message.textContent = "🎉 New Best Score: " + score + "!";
      } else {
        message.textContent = "⏱️ Time's up! Your score: " + score;
      }
    }
  </script>

</body>
</html>
